name: dbt Deploy

on:
  push:
    branches: [main]
    paths:
      - 'dbt_olist/**'
      - '.github/workflows/dbt_deploy.yml'
  workflow_dispatch:  # allow manual trigger

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks==1.8.4

      - name: dbt deps
        working-directory: dbt_olist
        env:
          DBT_PROFILES_DIR: .
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt deps

      - name: dbt build (run + test all models)
        working-directory: dbt_olist
        env:
          DBT_PROFILES_DIR: .
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt build --exclude source:bronze

      - name: dbt snapshot
        working-directory: dbt_olist
        env:
          DBT_PROFILES_DIR: .
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: dbt snapshot