name: dbt CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'dbt_olist/**'
      - '.github/workflows/dbt_ci.yml'

jobs:
  parse-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-databricks==1.8.4

      - name: Write profiles.yml from secrets
        working-directory: dbt_olist
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          cat > profiles.yml <<EOF
          dbt_olist:
            target: dev
            outputs:
              dev:
                type: databricks
                catalog: olist
                schema: dev
                host: "${DATABRICKS_HOST}"
                http_path: "${DATABRICKS_HTTP_PATH}"
                token: "${DATABRICKS_TOKEN}"
                threads: 4
          EOF

      - name: dbt deps
        working-directory: dbt_olist
        env:
          DBT_PROFILES_DIR: .
        run: dbt deps

      - name: dbt parse
        working-directory: dbt_olist
        env:
          DBT_PROFILES_DIR: .
        run: dbt parse

      - name: dbt compile
        working-directory: dbt_olist
        env:
          DBT_PROFILES_DIR: .
        run: dbt compile