version: 2

models:
  - name: dim_date
    description: "Date dimension — one row per calendar day from 2016 to 2020."
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null
      - name: date_day
        data_tests:
          - unique
          - not_null

  - name: dim_customer
    description: "Customer dimension — one row per customer (deduped on customer_unique_id)."
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension — one row per product, with English category name."
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_seller
    description: "Seller dimension — one row per seller."
    columns:
      - name: seller_key
        data_tests:
          - unique
          - not_null
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Order line-item fact table. Grain: one row per order item."
    columns:
      - name: order_item_key
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: order_item_id
        data_tests:
          - not_null
      - name: customer_key
        data_tests:
          - not_null
      - name: product_key
        data_tests:
          - not_null
      - name: seller_key
        data_tests:
          - not_null
      - name: date_key
        data_tests:
          - not_null
      - name: item_price
        data_tests:
          - not_null