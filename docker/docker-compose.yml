x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file:
    - ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    DATABRICKS_CATALOG: ${DATABRICKS_CATALOG}
    MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/logs:/opt/airflow/logs
    - ../airflow/plugins:/opt/airflow/plugins
    - ../ingestion:/opt/airflow/ingestion
    - ../dbt_olist:/opt/airflow/dbt_olist
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - olist-net

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: olist-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - olist-net

  postgres:
    image: postgres:15
    container_name: olist-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olist-net

  airflow-init:
    <<: *airflow-common
    container_name: olist-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true
        echo "Airflow init complete."

  airflow-webserver:
    <<: *airflow-common
    container_name: olist-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: olist-airflow-scheduler
    command: scheduler
    restart: unless-stopped

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: olist-jupyter
    user: root
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ../ingestion:/home/jovyan/work
      - jupyter-data:/home/jovyan/.local
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    networks:
      - olist-net

volumes:
  mssql-data:
  postgres-data:
  jupyter-data:

networks:
  olist-net:
    driver: bridge